    <script>
        // Adjust these paths if your api folder is somewhere else!
        const FETCH_URL = '../api/fetch_tasks.php'; 
        const UPDATE_URL = '../api/update_status.php';

        function fetchLiveTasks() {
            fetch(FETCH_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderTasks(data.tasks);
                        document.getElementById('connection-status').innerHTML = '<i class="fa-solid fa-circle-dot fa-fade"></i> Live Sync Active';
                        document.getElementById('connection-status').style.color = 'var(--primary)';
                    } else {
                        console.error("Server Error:", data.message);
                    }
                })
                .catch(error => {
                    console.error("Network Error:", error);
                    document.getElementById('connection-status').innerHTML = '<i class="fa-solid fa-wifi" style="color:var(--accent);"></i> Disconnected';
                });
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('empty-state');
            
            list.innerHTML = ''; 

            if (tasks.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            tasks.forEach((task, index) => {
                const isUrgent = task.type === 'urgent';
                const sourceIcon = task.source === 'app' ? 'fa-mobile-screen' : 'fa-door-open';
                
                const cardHtml = `
                    <div class="overview-card ${isUrgent ? 'urgent' : 'ready'}" id="task-${task.order_id}">
                        <div class="overview-info">
                            <div class="overview-icon">
                                <i class="fa-solid ${task.icon}"></i>
                            </div>
                            <div>
                                <div class="overview-title">
                                    ${task.title} 
                                    <span class="keyboard-badge">Press ${index + 1}</span>
                                </div>
                                <div class="overview-desc"><b>${task.order_number}</b> - ${task.desc}</div>
                                <div class="overview-tags">
                                    <span class="tag"><i class="fa-solid fa-user"></i> ${task.customer_name}</span>
                                    <span class="tag"><i class="fa-solid ${sourceIcon}"></i> ${task.source}</span>
                                    <span class="tag">Status: ${task.raw_status.replace('_', ' ')}</span>
                                </div>
                            </div>
                        </div>
                        <button class="overview-btn ${isUrgent ? 'btn-urgent' : 'btn-ready'}" 
                                onclick="completeTask(this, ${task.order_id}, '${task.next_status}')">
                            ${task.btn_text} <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function completeTask(btn, orderId, nextStatus) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.classList.add('btn-disabled');
            btn.disabled = true;

            fetch(UPDATE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                // Notice we send 'new_status' here, which your updated PHP file handles perfectly
                body: `order_id=${orderId}&new_status=${nextStatus}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const card = document.getElementById(`task-${orderId}`);
                    card.style.opacity = '0';
                    card.style.transform = 'translateX(50px)';
                    setTimeout(() => fetchLiveTasks(), 300);
                } else {
                    alert("Failed: " + data.message);
                    btn.innerHTML = originalText;
                    btn.classList.remove('btn-disabled');
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                btn.innerHTML = originalText;
                btn.classList.remove('btn-disabled');
                btn.disabled = false;
            });
        }

        // Keyboard Shortcuts (1-9)
        document.addEventListener('keydown', (e) => {
            const key = parseInt(e.key);
            if (key >= 1 && key <= 9) {
                const buttons = document.querySelectorAll('.overview-btn');
                if (buttons[key - 1]) buttons[key - 1].click();
            }
        });

        // ORDERS TOGGLE (Shift Highlight Properly)
const ordersToggle = document.getElementById("orders-toggle");
const ordersSubMenu = document.getElementById("orders-sub-menu");
const arrowIcon = document.getElementById("arrow-icon");
const ordersWrapper = document.getElementById("orders-wrapper");

// This is your currently active page wrapper (Task Overview)
const activePageWrapper = document.querySelector(".nav-item-wrapper.active-parent");

ordersToggle.addEventListener("click", function () {

    const isOpening = !ordersSubMenu.classList.contains("open");

    // Toggle dropdown
    ordersSubMenu.classList.toggle("open");
    arrowIcon.classList.toggle("active");

    if (isOpening) {
        // Remove highlight from active page
        if (activePageWrapper) {
            activePageWrapper.classList.remove("active-parent");
        }

        // Add highlight to Orders
        ordersWrapper.classList.add("active-parent");

    } else {
        // Remove highlight from Orders
        ordersWrapper.classList.remove("active-parent");

        // Restore highlight to current page
        if (activePageWrapper) {
            activePageWrapper.classList.add("active-parent");
        }
    }
});
function setTheme(mode) {
    if (mode === "light") {
        document.body.classList.add("light-mode");
        localStorage.setItem("theme", "light");
    } else {
        document.body.classList.remove("light-mode");
        localStorage.setItem("theme", "dark");
    }
}

function toggleTheme() {
    const isLight = document.body.classList.contains("light-mode");
    setTheme(isLight ? "dark" : "light");
}

document.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("theme");
    const switchEl = document.getElementById("themeSwitch");

    if (saved === "light") {
        document.body.classList.add("light-mode");
        if (switchEl) switchEl.checked = true;
    }
});

        // Boot it up
        window.onload = fetchLiveTasks;
        setInterval(fetchLiveTasks, 3000); // Poll every 3 seconds
    </script>
